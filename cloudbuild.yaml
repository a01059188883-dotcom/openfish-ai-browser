steps:
  - name: gcr.io/cloud-builders/docker
    id: Build OpenFish Playwright engine
    args:
      - build
      - --pull
      - -f
      - services/browser-engine/Dockerfile
      - -t
      - ${_IMAGE_URI}:${SHORT_SHA}
      - -t
      - ${_IMAGE_URI}:latest
      - services/browser-engine

  - name: gcr.io/cloud-builders/docker
    id: Push versioned image
    args:
      - push
      - ${_IMAGE_URI}:${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: Push latest image
    args:
      - push
      - ${_IMAGE_URI}:latest

images:
  - ${_IMAGE_URI}:${SHORT_SHA}
  - ${_IMAGE_URI}:latest

substitutions:
  _IMAGE_URI: asia-northeast3-docker.pkg.dev/openfish-ai-browser/cloud-run-source-deploy/openfish-browser-engine

options:
  logging: CLOUD_LOGGING_ONLY
