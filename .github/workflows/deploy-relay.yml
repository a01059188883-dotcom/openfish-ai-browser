name: Deploy OpenFish Relay

on:
  workflow_dispatch:
  # One-time v2.25.0 release gate: only the dedicated marker file on main deploys.
  # Normal PR merges and unrelated main pushes never deploy production.
  push:
    branches: [main]
    paths:
      - ".release/openfish-v2.25.0"

concurrency:
  group: openfish-cloudrun-engine-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release
        run: |
          npm run check
          npm test

      # Cloudflare Browser Run is the supported cloud-browser fallback. The
      # self-hosted Cloud Run engine is optional and must never block that path.
      # Missing optional secrets preserve existing Worker secrets unchanged.
      - name: Validate deployment configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENFISH_BOOTSTRAP_SECRET: ${{ secrets.OPENFISH_BOOTSTRAP_SECRET }}
          OPENFISH_VAULT_KEY: ${{ secrets.OPENFISH_VAULT_KEY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          BROWSER_ENGINE_TOKEN: ${{ secrets.BROWSER_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          if [ -n "$OPENFISH_BOOTSTRAP_SECRET" ] && [ "${#OPENFISH_BOOTSTRAP_SECRET}" -lt 32 ]; then
            echo "OPENFISH_BOOTSTRAP_SECRET must be at least 32 characters when set"; exit 1
          fi
          if [ -n "$OPENFISH_VAULT_KEY" ] && [ "${#OPENFISH_VAULT_KEY}" -lt 32 ]; then
            echo "OPENFISH_VAULT_KEY must be at least 32 characters when set"; exit 1
          fi
          if [ -n "$OPENFISH_VAULT_KEY" ]; then
            echo "vault_key_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "vault_key_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENFISH_VAULT_KEY is absent; preserving the existing Worker secret. If no Worker vault key exists, cloud login/vault features will remain unavailable."
          fi
          if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ] && [ "${#BROWSER_ENGINE_TOKEN}" -ge 32 ]; then
            echo "cloudrun_enabled=true" >> "$GITHUB_OUTPUT"
            echo "All Cloud Run deployment credentials are configured."
          else
            echo "cloudrun_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloud Run deployment skipped: GCP federation credentials and a 32+ character browser engine token are optional. Cloudflare Browser Run remains the cloud-browser provider."
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: steps.config.outputs.cloudrun_enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: openfish-ai-browser

      - name: Set up Google Cloud SDK
        if: steps.config.outputs.cloudrun_enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy self-hosted browser engine to Cloud Run
        id: engine
        if: steps.config.outputs.cloudrun_enabled == 'true'
        env:
          BROWSER_ENGINE_TOKEN: ${{ secrets.BROWSER_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          gcloud run deploy openfish-browser-engine \
            --source services/browser-engine \
            --project openfish-ai-browser \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 2Gi --concurrency 80 --timeout 300 \
            --min 0 --max 1 --no-traffic --tag=preflight \
            --add-volume mount-path=/downloads,type=in-memory,size-limit=64Mi \
            --set-env-vars "OPENFISH_ENGINE_TOKEN=${BROWSER_ENGINE_TOKEN},OPENFISH_DOWNLOADS_DIR=/downloads,OPENFISH_REQUIRE_DOWNLOADS_TMPFS=true" \
            --quiet
          PREFLIGHT_URL="$(gcloud run services describe openfish-browser-engine --project openfish-ai-browser --region asia-northeast3 --format='value(status.traffic[?tag=preflight].url)')"
          case "$PREFLIGHT_URL" in https://*) ;; *) echo "Cloud Run did not return a tagged preflight URL"; exit 1 ;; esac
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 -H "Authorization: Bearer ${BROWSER_ENGINE_TOKEN}" "$PREFLIGHT_URL/health" > /tmp/openfish-engine-health.json; then
              node -e 'const h=require("/tmp/openfish-engine-health.json"); if(!h.ok || h.version!=="1.3.6" || h.downloadStorage?.mode!=="required-tmpfs" || !(h.downloadStorage.capacityBytes>0) || h.downloadStorage.capacityBytes>64*1024*1024+4096) process.exit(1);'
              gcloud run services update-traffic openfish-browser-engine --project openfish-ai-browser --region asia-northeast3 --to-latest --remove-tags=preflight --quiet
              ENGINE_URL="$(gcloud run services describe openfish-browser-engine --project openfish-ai-browser --region asia-northeast3 --format='value(status.url)')"
              case "$ENGINE_URL" in https://*) ;; *) echo "Cloud Run did not return an HTTPS service URL"; exit 1 ;; esac
              curl --fail --silent --show-error --max-time 10 -H "Authorization: Bearer ${BROWSER_ENGINE_TOKEN}" "$ENGINE_URL/health" > /tmp/openfish-engine-health.json
              node -e 'const h=require("/tmp/openfish-engine-health.json"); if(!h.ok || h.version!=="1.3.6") process.exit(1);'
              echo "url=$ENGINE_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Cloud Run engine health check did not become ready"
          exit 1

      - name: Deploy Cloudflare Worker and Durable Object
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure cloud login bootstrap and vault encryption secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENFISH_BOOTSTRAP_SECRET: ${{ secrets.OPENFISH_BOOTSTRAP_SECRET }}
          OPENFISH_VAULT_KEY: ${{ secrets.OPENFISH_VAULT_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$OPENFISH_BOOTSTRAP_SECRET" ]; then
            printf '%s' "$OPENFISH_BOOTSTRAP_SECRET" | npx --yes wrangler@4 secret put OPENFISH_BOOTSTRAP_SECRET --config cloudflare/wrangler.toml
          else
            echo "Bootstrap secret not set; leaving the existing Worker bootstrap secret unchanged."
          fi
          if [ -n "$OPENFISH_VAULT_KEY" ]; then
            printf '%s' "$OPENFISH_VAULT_KEY" | npx --yes wrangler@4 secret put OPENFISH_VAULT_KEY --config cloudflare/wrangler.toml
          else
            echo "Vault key not set; leaving the existing Worker vault key unchanged to avoid breaking encrypted data."
          fi

      - name: Connect the verified Cloud Run engine to the Worker
        if: steps.config.outputs.cloudrun_enabled == 'true' && steps.engine.outputs.url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BROWSER_ENGINE_TOKEN: ${{ secrets.BROWSER_ENGINE_TOKEN }}
          BROWSER_ENGINE_URL: ${{ steps.engine.outputs.url }}
        run: |
          set -euo pipefail
          printf '%s' "$BROWSER_ENGINE_URL" | npx --yes wrangler@4 secret put BROWSER_ENGINE_URL --config cloudflare/wrangler.toml
          printf '%s' "$BROWSER_ENGINE_TOKEN" | npx --yes wrangler@4 secret put BROWSER_ENGINE_TOKEN --config cloudflare/wrangler.toml
          echo "Verified Cloud Run engine URL and token are configured as Worker secrets."

      - name: Smoke test deployed OpenFish web app and plugin schema
        run: |
          set -euo pipefail
          base="https://openfish-ai-browser-relay.a01059188883.workers.dev"
          curl --retry 5 --retry-delay 2 -fsS "$base/?v=2.25.0" -o /tmp/openfish-index.html
          grep -Fq 'ai-workbench.js?v=2.25.0' /tmp/openfish-index.html
          curl --retry 5 --retry-delay 2 -fsS "$base/ai-workbench.js?v=2.25.0" -o /tmp/openfish-ai-workbench.js
          grep -Fq 'function validatePlan' /tmp/openfish-ai-workbench.js
          curl --retry 5 --retry-delay 2 -fsS "$base/app.js?v=2.25.0" -o /tmp/openfish-app.js
          grep -Fq 'OpenFish' /tmp/openfish-app.js
          curl --retry 5 --retry-delay 2 -fsS "$base/api/v1/openapi.json" -o /tmp/openfish-openapi.json
          node -e 'const x=require("/tmp/openfish-openapi.json"); for (const p of ["/api/v1/browser/status","/api/v1/browser/navigate","/api/v1/browser/action"]) if(!x.paths?.[p]) process.exit(1);'
          echo "Production Worker frontend and browser plugin schema are reachable and match v2.25.0."
