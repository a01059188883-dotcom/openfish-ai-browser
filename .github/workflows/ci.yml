name: OpenFish CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Install Playwright Chromium for mobile UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify local single-machine setup diagnostics
        run: npm run doctor
      - run: npm test
      - name: Build self-hosted Chromium engine image
        run: docker build --pull -f services/browser-engine/Dockerfile -t openfish-browser-engine:ci services/browser-engine
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.toml
