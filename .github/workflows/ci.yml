name: OpenFish CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: KOREA LOTTO live browser smoke test
        run: npm run test:lotto
        env:
          LOTTO_SMOKE_URL: https://korea-lotto-3vx.pages.dev
