name: Deploy OpenFish Cloudflare Preview
on:
  push:
    branches:
      - feature/cloudflare-browser-run-v1
  workflow_dispatch:
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deployment secrets
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENFISH_TOKEN: ${{ secrets.OPENFISH_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ] && [ -n "$OPENFISH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and OPENFISH_API_TOKEN as GitHub Actions secrets."
          fi
      - name: Install Worker dependencies
        if: steps.credentials.outputs.ready == 'true'
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Deploy preview Worker
        if: steps.credentials.outputs.ready == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set Worker API token
        if: steps.credentials.outputs.ready == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENFISH_API_TOKEN: ${{ secrets.OPENFISH_API_TOKEN }}
        run: printf '%s' "$OPENFISH_API_TOKEN" | npx wrangler secret put OPENFISH_API_TOKEN
