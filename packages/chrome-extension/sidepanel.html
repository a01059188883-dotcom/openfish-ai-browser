<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFish</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><div class="logo">◉</div><div><h1>OpenFish</h1><small>AI Browser · 1.0.8</small></div><span id="status" class="status">检查连接中</span></header>
  <main>
    <section class="panel"><h2>当前网页</h2><button id="inspect">读取网页内容</button><div id="page" class="output">尚未读取</div></section>
    <section class="panel"><h2>任务助手</h2><label for="goal">告诉 OpenFish 你想做什么</label><textarea id="goal" placeholder="例如：总结当前网页的主要内容"></textarea><button id="run" class="primary">生成安全操作计划</button><div id="result" class="output">任务结果会显示在这里</div><button id="execute" class="primary" hidden>审核通过并执行计划</button></section>
    <p class="hint">提示：涉及发送、购买、删除或提交的操作必须由你检查并确认。</p>
  </main><script src="sidepanel.js"></script>
</body></html>
