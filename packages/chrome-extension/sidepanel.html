<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFish</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><div class="logo">◉</div><div><h1>OpenFish</h1><small>AI Browser · 2.13.4</small></div><span id="status" class="status">检查连接中</span><button id="openCommandPalette" type="button" class="compact">⌘ 命令</button></header>
  <main><section id="commandPalette" class="command-palette" hidden><div class="command-heading"><strong>OpenFish 命令中心</strong><button id="closeCommandPalette" type="button" class="compact">关闭</button></div><input id="commandSearch" type="search" placeholder="搜索命令…"><div id="commandResults" class="command-results"></div><p class="hint">快捷键：Ctrl/⌘ + K 打开；Esc 关闭；Ctrl/⌘ + Shift + T 恢复标签。</p></section>
    <section class="panel"><h2>当前网页</h2><div class="browser-controls"><button id="back" type="button" title="后退">← 后退</button><button id="forward" type="button" title="前进">前进 →</button><button id="reload" type="button" title="刷新当前网页">↻ 刷新</button></div><div class="browser-tools"><button id="inspect" type="button">读取网页内容</button><button id="captureScreenshot" type="button">网页截图</button><button id="readerMode" type="button">阅读模式</button><button id="pageDiagnostics" type="button">页面诊断</button><button id="pagePerformance" type="button">性能分析</button><button id="clearSessionData" type="button">清理会话数据</button></div><div id="screenshotPreview" class="screenshot-preview" hidden><img id="screenshotImage" alt="当前网页截图预览"><p id="screenshotCaption" class="hint"></p></div><div class="page-search"><input id="findInPageQuery" placeholder="查找网页文字"><button id="findInPage" type="button">查找</button></div><div id="page" class="output">尚未读取</div></section>
    <section class="panel" id="tabsPanel"><div class="section-heading"><h2>标签页管理</h2><button id="refreshTabs" type="button" class="compact">刷新列表</button></div><div class="tab-create"><input id="newTabUrl" type="url" placeholder="可选：输入网址"><button id="newTab" type="button">＋ 新建标签</button></div><input id="tabsSearch" class="library-search" type="search" placeholder="搜索标签标题、网址或分组"><button id="restoreClosedTab" type="button" class="compact">↶ 恢复最近关闭的标签</button><div id="tabsList" class="tabs-list"><p class="hint">正在读取标签页…</p></div></section>
    <section class="panel" id="workspacePanel"><div class="section-heading"><h2>工作区管理</h2><button id="refreshWorkspaces" type="button" class="compact">刷新</button></div><div class="workspace-create"><input id="workspaceName" maxlength="60" placeholder="工作区名称，例如：研究项目"><button id="saveWorkspace" type="button">保存当前标签</button></div><div id="workspaceList" class="workspace-list"><p class="hint">正在读取工作区…</p></div></section>\n    <section class="panel" id="downloadsPanel"><div class="section-heading"><h2>下载管理</h2><button id="refreshDownloads" type="button" class="compact">刷新</button></div><label for="downloadSelector">下载链接选择器</label><input id="downloadSelector" class="library-search" placeholder="例如：a.download 或 #file-link"><button id="downloadLink" type="button">下载选中的链接</button><div id="downloadsList" class="downloads-list"><p class="hint">正在读取下载记录…</p></div><p class="hint">单个文件最大 25 MB，管理区总容量最大 500 MB；删除文件需要确认。</p></section>\n    <section class="panel" id="libraryPanel"><div class="section-heading"><h2>浏览器资料库</h2><button id="refreshLibrary" type="button" class="compact">刷新</button></div><div class="library-actions"><button id="saveBookmark" type="button">☆ 收藏当前页</button><button id="saveReading" type="button">◷ 稍后阅读</button></div><div class="backup-actions"><button id="exportLibrary" type="button">导出资料库备份</button><button id="importLibraryButton" type="button">导入备份</button><input id="importLibraryFile" type="file" accept="application/json,.json" hidden></div><div class="library-tabs"><button type="button" data-library-tab="bookmarks" class="selected">书签</button><button type="button" data-library-tab="reading">稍后阅读</button><button type="button" data-library-tab="history">浏览历史</button></div><label class="sr-only" for="librarySearch">搜索浏览器资料</label><input id="librarySearch" class="library-search" type="search" placeholder="搜索标题或网址"><div id="libraryList" class="library-list"><p class="hint">正在读取资料库…</p></div></section>
    <section class="panel"><h2>任务助手</h2><label for="goal">告诉 OpenFish 你想做什么</label><textarea id="goal" placeholder="例如：总结当前网页的主要内容"></textarea><button id="run" class="primary">生成安全操作计划</button><div id="result" class="output">任务结果会显示在这里</div><button id="execute" class="primary" hidden>审核通过并执行计划</button></section>
    <p class="hint">提示：涉及发送、购买、删除或提交的操作必须由你检查并确认。</p>
  </main><script src="sidepanel.js"></script>
</body></html>
