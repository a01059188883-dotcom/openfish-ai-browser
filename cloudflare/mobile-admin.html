<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>OpenFish 手机管理后台</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2d;--line:#26364c;--text:#e8eef8;--muted:#91a3ba;--accent:#5ee0bd;--warn:#f0c879;--bad:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:#0e1726ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px;z-index:2}h1{font-size:21px;margin:0 0 5px}header p,.muted,.hint{color:var(--muted);font-size:12px;margin:0}.wrap{max-width:900px;margin:auto;padding:14px 12px 48px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#0c1625;border:1px solid var(--line);border-radius:10px;padding:12px}.stat small{display:block;color:var(--muted)}.stat b{font-size:22px;display:block;margin-top:5px;overflow-wrap:anywhere}h2{font-size:16px;margin:0 0 12px}input,textarea,button{font:inherit;border-radius:9px}input,textarea{background:#091321;border:1px solid var(--line);color:var(--text);padding:11px;width:100%;margin:6px 0}textarea{min-height:88px;resize:vertical}button{border:1px solid var(--line);background:#1b2b40;color:var(--text);padding:10px 13px;min-height:42px}button.primary{background:#145348;border-color:#287565}button.danger{color:var(--bad)}button:disabled{opacity:.45}.pill{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:6px 10px;color:var(--warn)}.pill.ok{color:var(--accent)}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:9px;padding:10px;overflow-wrap:anywhere}.item b,.item small{display:block}.item small{color:var(--muted);margin-top:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#08111e;padding:12px;border-radius:9px;max-height:340px;overflow:auto;font-size:12px}.hidden{display:none}.status{font-size:13px;margin-top:8px;color:var(--warn)}.status.good{color:var(--accent)}.status.bad{color:var(--bad)}label{font-size:13px;color:var(--muted)}@media(min-width:700px){.wrap{padding:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><div class="row between"><div><h1>◉ OpenFish 手机管理后台</h1><p>远程查看本地浏览器运行状态 · v2.6.0</p></div><span id="connection" class="pill">未连接</span></div></header>
<main class="wrap">
<section class="card"><h2>安全连接</h2><label for="token">Cloudflare Relay Token（仅本次浏览器会话保存）</label><input id="token" type="password" autocomplete="off" placeholder="粘贴你在 GitHub Secrets 中保存的 Relay Token"><div class="row"><button id="connect" class="primary">连接后台</button><button id="disconnect">断开并清除</button><button id="refresh">刷新</button></div><p class="hint">请勿把 Token 发给他人或粘贴到聊天中。使用 HTTPS；断开后会清除本次会话保存的 Token。</p><div id="message" class="status">等待连接</div></section>
<section class="card"><h2>运行状态</h2><div class="grid"><div class="stat"><small>Bridge</small><b id="bridge">—</b></div><div class="stat"><small>浏览器</small><b id="browser">—</b></div><div class="stat"><small>API 请求</small><b id="requests">—</b></div><div class="stat"><small>异常数</small><b id="errors">—</b></div></div><p class="hint" id="meta" style="margin-top:10px">版本 / 运行时间：—</p></section>
<section class="card"><div class="row between"><h2>浏览器会话</h2><button id="reloadSessions">刷新会话</button></div><div class="row"><input id="sessionName" placeholder="新会话名称" style="flex:1;min-width:150px"><button id="createSession" class="primary">创建</button></div><div id="sessions" class="list"><p class="muted">尚未加载</p></div></section>
<section class="card"><div class="row between"><h2>任务控制</h2><span class="pill">执行前必须审核</span></div><label for="goal">任务描述</label><textarea id="goal" placeholder="描述要浏览器执行的任务，例如读取当前网页并总结重点"></textarea><div class="row"><button id="makePlan" class="primary">生成计划</button><button id="runPlan" disabled>审核并执行</button></div><pre id="plan">尚无任务计划。生成计划不会执行任何操作。</pre></section>
<section class="card"><div class="row between"><h2>最近运行日志</h2><button id="reloadEvents">刷新日志</button></div><div id="events" class="list"><p class="muted">尚未加载</p></div></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let plan=null;let busy=false;const tokenKey="openfish.mobileAdminToken";$("token").value=sessionStorage.getItem(tokenKey)||"";
function message(text,kind=""){const el=$("message");el.textContent=text;el.className="status "+kind}
async function api(path,body){const token=$("token").value.trim();if(!token)throw Error("请先输入 Relay Token");const res=await fetch(path,{method:body===undefined?"GET":"POST",headers:{"authorization":"Bearer "+token,...(body===undefined?{}:{"content-type":"application/json"})},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||("HTTP "+res.status));return data}
function safe(tag,value){const n=document.createElement(tag);n.textContent=String(value??"");return n}
async function refresh(){if(busy)return;busy=true;try{const s=await api("/api/admin/status");$("connection").textContent="已连接";$("connection").className="pill ok";$("bridge").textContent="正常";$("browser").textContent=s.browser?.connected?"已连接":"未启动";$("requests").textContent=s.requests??0;$("errors").textContent=s.errors??0;$("meta").textContent="版本 "+s.version+" · 运行 "+(s.uptimeText||"—")+" · "+(s.model||"未配置");message("连接成功","good");await Promise.all([loadSessions(),loadEvents()]);}catch(e){$("connection").textContent="连接失败";$("connection").className="pill";message(e.message,"bad")}finally{busy=false}}
async function loadSessions(){const d=await api("/api/browser/sessions");const host=$("sessions");host.replaceChildren();for(const s of d.sessions||[]){const row=document.createElement("div");row.className="item";const top=document.createElement("div");top.className="row between";top.append(safe("b",s.name||"浏览器会话"),safe("small",s.active?"运行中":"待启动"));row.append(top,safe("small","ID: "+s.id),safe("small","最近活动: "+(s.lastUsedAt||"暂无")));if(s.id!=="default"){const btn=safe("button","关闭会话");btn.className="danger";btn.addEventListener("click",async()=>{if(!confirm("确定关闭会话？会清除该会话页面和 Cookie。"))return;btn.disabled=true;try{await api("/api/browser/sessions/"+encodeURIComponent(s.id)+"/close",{});await loadSessions()}catch(e){alert(e.message);btn.disabled=false}});row.append(btn)}host.append(row)}if(!host.children.length)host.append(safe("p","暂无会话"))}
async function loadEvents(){const d=await api("/api/admin/events");const host=$("events");host.replaceChildren();for(const e of (d.events||[]).slice(0,20)){const row=document.createElement("div");row.className="item";row.append(safe("b",e.path),safe("small",new Date(e.time).toLocaleString()+" · HTTP "+e.status));host.append(row)}if(!host.children.length)host.append(safe("p","暂无活动记录"))}
$("connect").addEventListener("click",()=>{sessionStorage.setItem(tokenKey,$("token").value.trim());refresh()});
$("disconnect").addEventListener("click",()=>{sessionStorage.removeItem(tokenKey);$("token").value="";$("connection").textContent="未连接";message("已断开并清除 Token")});
$("refresh").addEventListener("click",refresh);$("reloadSessions").addEventListener("click",()=>loadSessions().catch(e=>message(e.message,"bad")));$("reloadEvents").addEventListener("click",()=>loadEvents().catch(e=>message(e.message,"bad")));
$("createSession").addEventListener("click",async()=>{const b=$("createSession");b.disabled=true;try{await api("/api/browser/sessions",{name:$("sessionName").value.trim()||"Mobile AI Client"});$("sessionName").value="";await loadSessions();message("会话已创建","good")}catch(e){message(e.message,"bad")}finally{b.disabled=false}});
$("makePlan").addEventListener("click",async()=>{plan=null;$("runPlan").disabled=true;try{const d=await api("/api/plan",{goal:$("goal").value.trim()});if(!Array.isArray(d.steps)||!d.steps.length)throw Error("没有生成可执行步骤");plan=d;$("plan").textContent=JSON.stringify(d,null,2);$("runPlan").disabled=false;message("计划已生成，尚未执行","good")}catch(e){$("plan").textContent=e.message;message(e.message,"bad")}});
$("runPlan").addEventListener("click",async()=>{if(!plan||!confirm("请确认已逐条检查上方计划。现在批准执行？"))return;$("runPlan").disabled=true;try{const d=await api("/api/execute",{plan,approved:true});$("plan").textContent=JSON.stringify(d,null,2);message("执行请求已完成","good");await refresh()}catch(e){message(e.message,"bad")}finally{plan=null}});
if($("token").value)refresh();
})();
</script></body></html>
