name = "openfish-ai-browser-relay"
main = "worker.js"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "OPENFISH_RELAY"
class_name = "OpenFishRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpenFishRelay"]

[vars]
OPENFISH_RELAY_PROTOCOL = "openfish-relay/1"
