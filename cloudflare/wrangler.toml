name = "openfish-browser-preview"
main = "src/index.js"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[browser]
binding = "BROWSER"
remote = true

[[kv_namespaces]]
binding = "SESSIONS"
id = "b46d41f9057c41f683b9b91ca08d8bb2"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/health"]
